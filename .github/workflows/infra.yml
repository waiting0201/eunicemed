name: Deploy Infrastructure (Bicep)

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
  pull_request:
    paths:
      - 'infra/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: infra
  cancel-in-progress: false

jobs:
  # PR 上只跑 what-if。這是唯一能在動到正式資源之前看到差異的機會 ——
  # 本案沒有第二套環境可以先試（docs/07 §3）
  what_if:
    runs-on: ubuntu-latest
    name: What-if
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group what-if
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          # 未設定就是空字串，Bicep 會整項不寫（見 main.bicep 的 recaptchaSecretKey）
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          # SMTP relay（Brevo／Resend）。SMTP_HOST 空著就整組不寫，表單照樣入庫、不寄信。
          # 只有密碼是 secret，其餘放 variables 才看得到現在設的是哪一家。
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_TO: ${{ vars.SMTP_TO }}
        run: |
          az deployment group what-if \
            --resource-group EuniceMedUS \
            --template-file infra/main.bicep \
            --parameters infra/prod.bicepparam

  deploy:
    if: github.event_name != 'pull_request'
    needs: what_if
    runs-on: ubuntu-latest
    name: Deploy
    # 人工核准。這支會改動正式資源的設定，包括 Function App 的 App Settings
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: az deployment group create
        env:
          JWT_SIGNING_KEY: ${{ secrets.JWT_SIGNING_KEY }}
          SQL_CONNECTION_STRING: ${{ secrets.SQL_CONNECTION_STRING }}
          # 未設定就是空字串，Bicep 會整項不寫（見 main.bicep 的 recaptchaSecretKey）
          RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}
          # SMTP relay（Brevo／Resend）。SMTP_HOST 空著就整組不寫，表單照樣入庫、不寄信。
          # 只有密碼是 secret，其餘放 variables 才看得到現在設的是哪一家。
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ vars.SMTP_FROM }}
          SMTP_TO: ${{ vars.SMTP_TO }}
        run: |
          az deployment group create \
            --resource-group EuniceMedUS \
            --template-file infra/main.bicep \
            --parameters infra/prod.bicepparam \
            --query 'properties.outputs'
