name: Deploy Api (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - 'Api/**'
      - '.github/workflows/api-deploy.yml'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC 取得 federated token 用
  contents: read

# 同時只跑一個部署。Flex Consumption 沒有 slot，兩個部署疊在一起
# 就是兩份程式碼交錯覆蓋同一個 app（docs/07 §5.2）。
concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy Api
    # 需要人工核准：這支部署會在 Function App 啟動時直接對正式 DB 套用 migration，
    # 沒有預演環境也沒有 slot 可退（docs/07 §5.1）
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Api/Api.csproj -c Release --warnaserror

      - name: Publish
        run: dotnet publish Api/Api.csproj -c Release -o ./output

      # Flex Consumption 不支援 publish profile；用 OIDC 聯合身分登入（免長期密鑰）
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: func-eunicemed-prod
          package: ./output

      # 部署完 host 會重啟並在啟動時套用 migration。啟動失敗的話 app 根本起不來，
      # 而 functions-action 不會發現 —— 所以這裡自己確認一次。
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' \
              https://func-eunicemed-prod.azurewebsites.net/api/health || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempts"; cat /tmp/health.json; exit 0
            fi
            echo "attempt ${i}: HTTP ${code}"; sleep 10
          done
          echo "健康檢查在 5 分鐘內沒有通過。啟動時的 migration 可能失敗了 ——"
          echo "到 Function App 的 Log stream 看啟動記錄，並確認 DB 的 PITR 還原點。"
          exit 1
